services:
  azurelearn:
    container_name: azurelearn
    build:
      context: ./src/
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=db;Database=AzureDemoApp;User Id=sa;Password=YourStrong!Password;TrustServerCertificate=True;

    ports:
     - "8080:80"
    depends_on:
     db:
      condition: service_healthy

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: appdb
    platform: linux/amd64
    environment:
      SA_PASSWORD: "YourStrong!Password"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - dbdata:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrong!Password", "-Q", "SELECT 1", "-No"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 5s

volumes:
  dbdata: